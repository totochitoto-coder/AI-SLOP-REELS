<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #0b0c0e; --fg: #f4f4f5; --dim: #6b6f76; --green: #34d27a; --red: #e5484d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 720px; height: 1280px; overflow: hidden; background: var(--bg); }
  body { font-family: "Noto Sans CJK HK", "Noto Sans CJK TC", sans-serif; color: var(--fg); }
  #stage { position: relative; width: 720px; height: 1280px; overflow: hidden;
    background: radial-gradient(ellipse 70% 45% at 50% 0%, #2a2c31 0%, #131417 55%, #0b0c0e 100%); }
  #stars, #layer { position: absolute; inset: 0; }
  .star { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; }
  .abs { position: absolute; transform-origin: 50% 50%; }
  .caption { position: absolute; left: 40px; right: 40px; top: 120px; text-align: center;
    font-size: 40px; font-weight: 700; line-height: 1.5; }
  .tok { display: inline-block; padding: 0 6px; margin: 0 2px; color: var(--dim); position: relative; }
  .tok.past { color: var(--fg); }
  .tok.cur { color: #fff; outline: 2px solid rgba(255,255,255,.9); outline-offset: 2px; }
  .tok.cur::before, .tok.cur::after { content: ""; position: absolute; width: 7px; height: 7px; background: #fff; border-radius: 50%; }
  .tok.cur::before { left: -6px; top: -6px; }
  .tok.cur::after { right: -6px; bottom: -6px; }
  .label { font-size: 22px; font-weight: 700; letter-spacing: 4px; color: #c9ccd1; white-space: nowrap; }
  .headline { font-size: 50px; font-weight: 900; white-space: nowrap; }
  .pill { background: #f4f4f5; color: #111; font-weight: 700; font-size: 24px; padding: 10px 26px; border-radius: 999px; white-space: nowrap; }
  .pill.dark { background: #26282d; color: #e6e7ea; }
  .big { font-size: 140px; font-weight: 900; line-height: 1; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .foot { position: absolute; bottom: 250px; left: 0; right: 0; text-align: center; font-size: 18px; color: #5c6067; }
  .vs { font-size: 64px; font-weight: 900; color: #5b5f66; }
  .tag { font-size: 34px; font-weight: 900; padding: 8px 22px; border-radius: 12px; white-space: nowrap; }
</style>
</head>
<body>
<div id="stage"><div id="stars"></div><div id="layer"></div></div>
<script>
const W = 720, H = 1280;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const back = x => { x = clamp(x); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const inn = (lt, s, d = 0.35) => (lt - s) / d;
const fmt = n => Math.round(n).toLocaleString('en-US');

// deterministic stars
(function () {
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  let h = '';
  for (let i = 0; i < 70; i++) h += `<div class="star" style="left:${rnd() * W}px;top:${rnd() * H}px;opacity:${0.08 + rnd() * 0.25}"></div>`;
  document.getElementById('stars').innerHTML = h;
})();

function el(html, x, y, { op = 1, s = 1, ty = 0, rot = 0 } = {}) {
  return `<div class="abs" style="left:${x}px;top:${y + ty}px;opacity:${op};transform:translate(-50%,-50%) scale(${s}) rotate(${rot}deg)">${html}</div>`;
}
function person(color, h = 180) {
  const w = h * 0.62;
  return `<svg width="${w}" height="${h}" viewBox="0 0 62 100">
    <circle cx="31" cy="13" r="12" fill="${color}"/>
    <rect x="9" y="29" width="44" height="40" rx="12" fill="${color}"/>
    <rect x="15" y="62" width="11" height="36" rx="5" fill="${color}"/>
    <rect x="36" y="62" width="11" height="36" rx="5" fill="${color}"/>
  </svg>`;
}
function girl(color, h = 180) {
  const w = h * 0.62, hair = '#b8326f';
  return `<svg width="${w}" height="${h}" viewBox="0 0 62 100">
    <ellipse cx="47" cy="12" rx="7" ry="11" fill="${hair}"/>
    <circle cx="31" cy="13" r="14" fill="${hair}"/>
    <circle cx="31" cy="15" r="11" fill="${color}"/>
    <path d="M20 30 H42 Q46 30 47 34 L55 70 H7 L15 34 Q16 30 20 30 Z" fill="${color}"/>
    <rect x="18" y="66" width="10" height="32" rx="5" fill="${color}"/>
    <rect x="34" y="66" width="10" height="32" rx="5" fill="${color}"/>
  </svg>`;
}
function hostTag(S, size = 26) {
  return `<div style="background:${S.host.color};color:#0b0c0e;font-weight:900;font-size:${size}px;padding:4px 18px;border-radius:999px;white-space:nowrap">${S.host.name}</div>`;
}
function hostBadge(S) {
  return `<div class="abs" style="left:28px;top:34px;display:flex;align-items:center;gap:10px;transform:none">
    <div style="width:44px;height:44px;border-radius:50%;background:#1d1f23;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;border:2px solid ${S.host.color}">${girl(S.host.color, 50)}</div>
    ${hostTag(S, 20)}</div>`;
}

function car(kind, color, w = 300) {
  if (kind === 'sports') return `<svg width="${w}" height="${w * 0.42}" viewBox="0 0 200 84">
    <path d="M8 62 Q10 44 38 38 L78 24 Q100 16 126 20 L162 34 Q192 38 194 58 L194 66 H8 Z" fill="${color}"/>
    <path d="M84 30 L122 25 L150 38 H74 Z" fill="#0b0c0e" opacity=".55"/>
    <rect x="176" y="44" width="16" height="6" rx="3" fill="#ffe9a8"/>
    <circle cx="50" cy="66" r="15" fill="#1b1c20" stroke="#9aa0a8" stroke-width="5"/>
    <circle cx="156" cy="66" r="15" fill="#1b1c20" stroke="#9aa0a8" stroke-width="5"/></svg>`;
  return `<svg width="${w}" height="${w * 0.45}" viewBox="0 0 200 90">
    <path d="M8 66 L12 48 Q15 42 30 42 L56 42 L76 20 Q80 15 92 15 H134 Q146 15 152 22 L170 42 Q192 44 194 56 L194 70 H8 Z" fill="${color}"/>
    <path d="M80 24 H110 V42 H64 Z" fill="#0b0c0e" opacity=".55"/><path d="M116 24 H142 L160 42 H116 Z" fill="#0b0c0e" opacity=".55"/>
    <circle cx="50" cy="72" r="15" fill="#1b1c20" stroke="#9aa0a8" stroke-width="5"/>
    <circle cx="156" cy="72" r="15" fill="#1b1c20" stroke="#9aa0a8" stroke-width="5"/></svg>`;
}
function bubble(text, size = 36, bg = '#fff', fg = '#0b0c0e') {
  return `<div style="position:relative;background:${bg};color:${fg};font-weight:900;font-size:${size}px;padding:12px 28px;border-radius:26px;white-space:nowrap">${text}
    <div style="position:absolute;left:30px;bottom:-18px;border-left:12px solid transparent;border-right:16px solid transparent;border-top:22px solid ${bg}"></div></div>`;
}
function popIn(lt, s, d = 0.45) { const p = inn(lt, s, d); return { op: clamp(p * 2), s: back(p) }; }
function fadeUp(lt, s, d = 0.4) { const p = ease(inn(lt, s, d)); return { op: p, ty: (1 - p) * 30 }; }

function caption(sc, lt) {
  const tokens = sc.caption, n = tokens.length;
  const times = sc.tokenTimes || tokens.map((_, i) => i * sc.dur * 0.85 / n);
  let cur = 0;
  for (let i = 0; i < n; i++) if (lt >= times[i]) cur = i;
  // show one short phrase at a time: split after punctuation, merge tiny groups
  const groups = []; let g = [], len = 0;
  tokens.forEach((t, i) => {
    g.push(i); len += t.length;
    if ((/[，。！？～…,!?]$/.test(t) && len >= 6) || i === n - 1) { groups.push(g); g = []; len = 0; }
  });
  const grp = groups.find(gr => gr.includes(cur)) || groups[0];
  return `<div class="caption">` + grp.map(i =>
    `<span class="tok ${i < cur ? 'past' : i === cur ? 'cur' : ''}">${tokens[i]}</span>`).join('') + `</div>`;
}

function vsPair(S, lt, start, y = 640, size = 200) {
  const A = S.sides.a, B = S.sides.b;
  const pa = popIn(lt, start), pb = popIn(lt, start + 0.25), pv = popIn(lt, start + 0.45);
  return el(person(A.color, size), 210, y, pa) + el(`<div class="label">${A.label}</div>`, 210, y + size / 2 + 40, pa)
    + el(`<div class="vs">VS</div>`, 360, y, pv)
    + el(person(B.color, size), 510, y, pb) + el(`<div class="label">${B.label}</div>`, 510, y + size / 2 + 40, pb);
}

const SCENES = {
  vs_intro(S, sc, lt) {
    const bub = `<div style="position:relative;background:#fff;color:#0b0c0e;font-weight:900;font-size:34px;padding:12px 26px;border-radius:26px;white-space:nowrap">問你呀～
      <div style="position:absolute;left:24px;bottom:-18px;border-left:12px solid transparent;border-right:16px solid transparent;border-top:22px solid #fff"></div></div>`;
    if (!S.host) return el(`<div class="headline" style="color:var(--green)">${sc.headline}</div>`, 360, 380, fadeUp(lt, 0.1))
      + vsPair(S, lt, 0.5);
    return el(girl(S.host.color, 260), 330, 500, popIn(lt, 0.1))
      + el(hostTag(S, 34), 330, 670, popIn(lt, 0.3))
      + el(bub, 520, 340, { ...popIn(lt, 0.6), rot: -4 })
      + vsPair(S, lt, (sc.tokenTimes ? sc.tokenTimes[5] : 1.2), 920, 150);
  },
  guess(S, sc, lt) {
    const n = 3 - Math.floor(lt / (sc.dur / 3));
    const p = ((lt / (sc.dur / 3)) % 1);
    return vsPair(S, lt + 5, 0)
      + el(`<div class="big" style="font-size:110px;color:#fff">${Math.max(1, n)}</div>`, 360, 380, { op: 1 - p * 0.6, s: 1.25 - p * 0.25 })
      + el(`<div class="pill">${sc.pill}</div>`, 360, 920, popIn(lt, 0.3));
  },
  stat(S, sc, lt) {
    const side = S.sides[sc.side];
    const p = ease(inn(lt, sc.countTime ?? 0.6, 1.2));
    let h = el(person(side.color, 170), 360, 470, popIn(lt, 0.1));
    if (sc.box) {
      const b = popIn(lt, 0.35);
      h += el(`<div style="width:190px;height:220px;border:4px dashed #555a62;border-radius:10px"></div>`, 360, 475, b)
        + el(`<div class="label" style="color:#8b9098">${sc.sub}</div>`, 360, 620, fadeUp(lt, 0.6));
    }
    h += el(`<div class="big" style="color:${side.color};${sc.bigSize ? `font-size:${sc.bigSize}px` : ''}">${sc.prefix ?? ''}${fmt(sc.value * p)}</div>`, 360, 780, fadeUp(lt, (sc.countTime ?? 0.6) - 0.1))
      + el(`<div class="label">${sc.label}</div>`, 360, 880, fadeUp(lt, 0.8));
    if (sc.tag) h += el(`<div class="tag" style="background:var(--green);color:#0b0c0e">${sc.tag}</div>`, 360, 955, { ...popIn(lt, sc.cueTime ?? 2.4), rot: -3 });
    return h + `<div class="foot">${S.footnote}</div>`;
  },

  car_intro(S, sc, lt) {
    const side = S.sides[sc.side];
    let h = el(`<div class="headline" style="font-size:64px;color:${side.color}">${side.label}</div>`, 360, 300, fadeUp(lt, 0.1))
      + el(person(side.color, 230), 210, 540, popIn(lt, 0.2))
      + el(car(sc.car, side.color, 330), 480, 610, { ...popIn(lt, 0.5), ty: (1 - ease(inn(lt, 0.5, 0.6))) * 40 })
      + el(`<div class="label" style="font-size:30px">${sc.sub}</div>`, 360, 740, fadeUp(lt, 0.8));
    if (sc.counter) {
      const p = ease(inn(lt, sc.countTime ?? 1.5, 1.0));
      h += el(`<div class="big" style="font-size:120px;color:${side.color}">×${fmt(sc.counter * p)}</div>`, 300, 875, fadeUp(lt, (sc.countTime ?? 1.5) - 0.1))
        + el(`<div class="label" style="font-size:34px;color:#fff">${sc.counterLabel}</div>`, 520, 885, fadeUp(lt, sc.countTime ?? 1.5));
    }
    if (sc.bubble) h += el(bubble(sc.bubble, 52), 380, 880, { ...popIn(lt, sc.cueTime ?? 2.5), rot: -4 });
    return h + `<div class="foot">${S.footnote}</div>`;
  },
  ladder(S, sc, lt) {
    const lv = sc.levels, n = lv.length, y0 = 945, step = 135;
    const t0 = sc.countTime ?? 0.8, t1 = sc.cueTime ?? 2.6;
    const p = ease(inn(lt, t0, Math.max(0.6, t1 - t0)));
    const pos = p * (n - 1);
    let h = el(`<div class="headline" style="font-size:52px">${sc.title}</div>`, 360, 300, fadeUp(lt, 0.1));
    lv.forEach((name, i) => {
      const y = y0 - i * step, on = pos >= i - 0.05, top = i === n - 1;
      const c = top ? S.sides.a.color : '#3a3d44';
      h += el(`<div style="width:${300 + i * 40}px;height:96px;border-radius:16px;background:${on ? c : '#1d1f23'};border:3px solid ${top ? c : '#4a4e56'};display:flex;align-items:center;justify-content:center;font-weight:900;font-size:40px;color:${on && top ? '#fff' : on ? '#f4f4f5' : '#6b6f76'}">${name}</div>`, 420, y, popIn(lt, 0.2 + i * 0.12));
    });
    h += el(person('#f4f4f5', 110), 150, y0 - pos * step - 6, { op: clamp(inn(lt, 0.3, 0.3)) });
    if (pos > n - 1.05) h += el(`<div class="tag" style="background:var(--green);color:#0b0c0e">${sc.tag}</div>`, 420, y0 - (n - 1) * step - 110, { ...popIn(lt, t1), rot: -3 });
    return h + `<div class="foot">${S.footnote}</div>`;
  },
  fanout(S, sc, lt) {
    const cx = 360, cy = 560, r1 = 130, r2 = 225;
    const p1 = ease(inn(lt, sc.cue1Time ?? 1.0, 1.0)), p2 = ease(inn(lt, sc.cue2Time ?? 3.0, 1.2));
    const n1 = Math.round(50 * p1), n2 = Math.round(150 * p2);
    let svg = `<svg class="abs" style="left:0;top:0;transform:none" width="${W}" height="${H}">`;
    for (let j = 0; j < n2; j++) {
      const i = Math.floor(j / 3), a = ((i + ((j % 3) - 1) * 0.3) / 50) * Math.PI * 2 - Math.PI / 2;
      const a1 = (i / 50) * Math.PI * 2 - Math.PI / 2;
      svg += `<line x1="${cx + r1 * Math.cos(a1)}" y1="${cy + r1 * Math.sin(a1)}" x2="${cx + r2 * Math.cos(a)}" y2="${cy + r2 * Math.sin(a)}" stroke="#3cc8e8" stroke-opacity=".25" stroke-width="1.5"/>
        <circle cx="${cx + r2 * Math.cos(a)}" cy="${cy + r2 * Math.sin(a)}" r="6" fill="#3cc8e8"/>`;
    }
    for (let i = 0; i < n1; i++) {
      const a = (i / 50) * Math.PI * 2 - Math.PI / 2;
      svg += `<line x1="${cx}" y1="${cy}" x2="${cx + r1 * Math.cos(a)}" y2="${cy + r1 * Math.sin(a)}" stroke="#f4f4f5" stroke-opacity=".18" stroke-width="1.5"/>
        <circle cx="${cx + r1 * Math.cos(a)}" cy="${cy + r1 * Math.sin(a)}" r="8" fill="#f4f4f5"/>`;
    }
    svg += `<circle cx="${cx}" cy="${cy}" r="26" fill="${S.sides.a.color}"/></svg>`;
    let h = svg + el(`<div class="label" style="color:#fff;font-size:24px;letter-spacing:2px">${S.sides.a.label}</div>`, cx, cy + 48, { op: 1 })
      + el(`<div class="headline" style="font-size:44px">${fmt(n1)} <span style="font-size:28px;color:#c9ccd1">個前度</span></div>`, 220, 850, { op: clamp(p1 * 3) })
      + el(`<div class="headline" style="font-size:44px;color:#3cc8e8">${fmt(n2)} <span style="font-size:28px;color:#c9ccd1">個閨蜜</span></div>`, 500, 850, { op: clamp(p2 * 3) });
    if (sc.bubble) h += el(bubble(sc.bubble, 34), 360, 945, { ...popIn(lt, sc.cueTime ?? 5), rot: -3 });
    return h + `<div class="foot">${S.footnote}</div>`;
  },
  route(S, sc, lt) {
    const y = 560, x1 = 130, x2 = 590, xm = 360;
    const draw = ease(inn(lt, 0.3, 1.2));
    const t = ((lt - 1.2) / 1.6) % 2; const tt = lt < 1.2 ? 0 : (t < 1 ? t : 2 - t);
    const dotX = x1 + (x2 - x1) * ease(tt);
    let h = `<svg class="abs" style="left:0;top:0" width="${W}" height="${H}">
        <line x1="${x1}" y1="${y}" x2="${x1 + (x2 - x1) * draw}" y2="${y}" stroke="#3a3d44" stroke-width="10" stroke-linecap="round"/>
        <line x1="${x1}" y1="${y}" x2="${x1 + (x2 - x1) * draw}" y2="${y}" stroke="${S.sides.b.color}" stroke-width="3" stroke-dasharray="10 12"/>
      </svg>`;
    const node = (x, lbl, c, s) => el(`<div style="width:34px;height:34px;border-radius:50%;background:${c};box-shadow:0 0 24px ${c}"></div>`, x, y, popIn(lt, s))
      + el(`<div class="label" style="letter-spacing:2px;font-size:28px">${lbl}</div>`, x, y + 60, popIn(lt, s));
    h += node(x1, sc.from, S.sides.b.color, 0.2) + node(xm, sc.via, '#8b9098', 0.8) + node(x2, sc.to, S.sides.a.color, 1.3);
    if (lt > 1.2) h += el(person('#fff', 70), dotX, y - 70, { op: 1 });
    h += el(`<div class="headline" style="font-size:44px">${sc.line1}</div>`, 360, 800, fadeUp(lt, sc.cue1Time ?? 2.0))
      + el(`<div class="headline" style="font-size:56px;color:var(--red)">${sc.line2}</div>`, 360, 900, popIn(lt, sc.cue2Time ?? 3.4));
    return h + `<div class="foot">${S.footnote}</div>`;
  },
  bars(S, sc, lt) {
    const base = 860, max = 480, scale = max / (Math.max(sc.a, sc.b + sc.bExtra) * 1.05);
    const ga = ease(inn(lt, 0.3, 1.0)), gb = ease(inn(lt, 0.7, 1.0)), gx = ease(inn(lt, 1.9, 0.8));
    const ha = sc.a * scale * ga, hb = sc.b * scale * gb, hx = sc.bExtra * scale * gx;
    const bar = (x, h, c, bottom) => `<div class="abs" style="left:${x - 75}px;top:${base - bottom - h}px;width:150px;height:${h}px;background:${c};border-radius:8px;transform:none"></div>`;
    let h = bar(220, ha, S.sides.a.color, 0) + bar(500, hb, S.sides.b.color, 0) + bar(500, hx, '#e5484d', hb + (hx > 0 ? 6 : 0));
    h += el(`<div class="headline" style="font-size:40px;color:${S.sides.a.color}">$${fmt(sc.a * ga)}</div>`, 220, base - ha - 40, { op: ga })
      + el(`<div class="headline" style="font-size:40px;color:${S.sides.b.color}">$${fmt(sc.b * gb + sc.bExtra * gx)}</div>`, 500, base - hb - hx - 46, { op: gb });
    if (gx > 0.3) h += el(`<div class="label" style="color:#fff;letter-spacing:2px">+${sc.bExtraLabel}</div>`, 500, base - hb - hx / 2 - 3, { op: gx });
    h += el(`<div class="label">${S.sides.a.label}</div>`, 220, base + 40, { op: 1 }) + el(`<div class="label">${S.sides.b.label}</div>`, 500, base + 40, { op: 1 });
    h += el(`<div class="tag" style="background:var(--green);color:#0b0c0e;font-size:42px">${sc.result}</div>`, 360, 975, { ...popIn(lt, sc.cueTime ?? 3.3), rot: -2 });
    return h + `<div class="foot">${S.footnote}</div>`;
  },
  clock(S, sc, lt) {
    const ang = lt * 360;
    const clock = `<svg width="200" height="200" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="44" fill="none" stroke="#f4f4f5" stroke-width="6"/>
      <line x1="50" y1="50" x2="50" y2="20" stroke="#e5484d" stroke-width="6" stroke-linecap="round" transform="rotate(${ang} 50 50)"/>
      <line x1="50" y1="50" x2="70" y2="50" stroke="#f4f4f5" stroke-width="6" stroke-linecap="round" transform="rotate(${ang / 12} 50 50)"/>
      <circle cx="50" cy="50" r="5" fill="#f4f4f5"/></svg>`;
    const p = ease(inn(lt, sc.countTime ?? 0.8, 1.4));
    return el(clock, 360, 480, popIn(lt, 0.1))
      + el(`<div class="big" style="color:var(--red)">${fmt(sc.value * p)}</div>`, 360, 740, fadeUp(lt, (sc.countTime ?? 0.8) - 0.1))
      + el(`<div class="label">${sc.label}</div>`, 360, 840, fadeUp(lt, 0.9))
      + el(`<div class="tag" style="background:#f5b83d;color:#0b0c0e;font-size:46px">${sc.punch}</div>`, 360, 955, { ...popIn(lt, sc.cueTime ?? 3.3), rot: 2 })
      + `<div class="foot">${S.footnote}</div>`;
  },
  outro(S, sc, lt) {
    return el(`<div class="headline">${sc.headline}</div>`, 360, 380, fadeUp(lt, 0.1))
      + (S.host ? el(girl(S.host.color, 120), 300, 1150, popIn(lt, 2.0)) + el(hostTag(S, 28), 420, 1180, popIn(lt, 2.2)) : '')
      + vsPair(S, lt, 0.4, 580, 180)
      + el(`<div class="pill">${sc.pill1}</div>`, 360, 870, popIn(lt, 1.2))
      + el(`<div class="pill dark">${sc.pill2}</div>`, 360, 935, popIn(lt, 1.6));
  }
};

window.setScript = S => {
  window.S = S; let t = 0;
  S.scenes.forEach(sc => { sc.start = t; t += sc.dur; });
  window.TOTAL = t; return t;
};
window.renderFrame = t => {
  const S = window.S;
  const sc = S.scenes.find(s => t >= s.start && t < s.start + s.dur) || S.scenes[S.scenes.length - 1];
  const lt = t - sc.start;
  // short crossfade at scene edges
  const fade = Math.min(clamp(lt / 0.15), clamp((sc.dur - lt) / 0.15));
  document.getElementById('layer').style.opacity = sc === S.scenes[S.scenes.length - 1] ? clamp(lt / 0.15) : fade;
  const badge = S.host && !['vs_intro', 'outro'].includes(sc.type) ? hostBadge(S) : '';
  document.getElementById('layer').innerHTML = SCENES[sc.type](S, sc, lt) + badge + caption(sc, lt);
};
</script>
</body>
</html>
